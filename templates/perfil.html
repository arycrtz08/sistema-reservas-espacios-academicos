<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub | Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
            color: #102542;
        }

        .navbar-custom {
            background: linear-gradient(90deg, #0b2a5b, #173b9b);
            padding: 14px 0;
        }

        .brand span {
            color: #18c29c;
        }

        .profile-card {
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, .08);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #087d61);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 20px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: left;
        }

        .info-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-custom mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="navbar-brand fw-bold brand">Campus<span>Hub</span></a>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2">Volver al Home</a>
                <a href="/logout" class="btn btn-danger btn-sm">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="profile-card">
                    <div class="avatar">
                        {{ usuario[0] | upper }}
                    </div>
                    <h3 class="fw-bold mb-4">{{ usuario }}</h3>

                    <div class="info-box">
                        <div class="info-label">Carnet Institucional</div>
                        <div class="info-value">{{ carnet }}</div>
                    </div>

                    <div class="info-box">
                        <div class="info-label">Cohorte Asignada</div>
                        <div class="info-value">{{ cohorte }}</div>
                    </div>

                    <a href="/mis_reservas" class="btn btn-primary w-100 mt-3 py-2"
                        style="border-radius: 14px; font-weight: 600;">
                        <i class="bi bi-clock-history me-2"></i> Ver Historial de Reservas
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
