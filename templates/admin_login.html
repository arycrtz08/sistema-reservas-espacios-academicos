{% extends 'base.html' %}{% block title %}CampusHub | Administrador{% endblock %}{% block nav %}{% endblock %}
{% block content %}<div class="row min-vh-100 justify-content-center align-items-center"><div class="col-md-5 col-lg-4"><div class="card-clean"><h2 class="fw-bold text-center">Campus<span class="text-success">Hub</span></h2><p class="text-center text-muted">Acceso administrativo</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label class="form-label">Usuario admin</label><input name="usuario" class="form-control mb-3" required><label class="form-label">Contraseña</label><input name="contrasena" type="password" class="form-control mb-4" required><button class="btn btn-success btn-rounded w-100">Iniciar sesión</button></form><a href="{{ url_for('login') }}" class="btn btn-outline-secondary btn-rounded w-100 mt-3">Volver</a></div></div></div>{% endblock %}
