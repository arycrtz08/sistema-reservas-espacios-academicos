<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub | Admin Login</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #111827;
            color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #1f2937;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .4);
            border: 1px solid #374151;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            color: white;
        }

        .brand span {
            color: #10b981;
        }

        .login-card p {
            color: #9ca3af;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
            color: #d1d5db;
        }

        .form-control {
            background: #374151;
            border: 1px solid #4b5563;
            color: white;
            border-radius: 12px;
            padding: 12px 14px;
        }

        .form-control:focus {
            background: #374151;
            color: white;
            border-color: #10b981;
            box-shadow: 0 0 0 .2rem rgba(16, 185, 129, .25);
        }

        .form-control::placeholder {
            color: #6b7280;
        }

        .btn-main {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 14px;
            padding: 12px;
            color: white;
            font-weight: 700;
            margin-top: 10px;
        }

        .btn-main:hover {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            transition: color .2s;
        }

        .back-link:hover {
            color: #10b981;
        }

        .toggle-password {
            cursor: pointer;
            background: #374151;
            border: 1px solid #4b5563;
            border-left: none;
            color: #9ca3af;
        }

        .toggle-password:hover {
            color: white;
            background: #4b5563;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand">
            Campus<span>Hub</span>
        </div>
        <p>Acceso seguro para Administradores</p>

        {% if error %}
        <div class="alert alert-danger text-center" role="alert"
            style="background-color: #ef4444; color: white; border: none;">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login_admin">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario Admin</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary text-secondary">
                        <i class="bi bi-person"></i>
                    </span>

                    <input type="text"
                           class="form-control border-start-0 ps-0"
                           id="usuario"
                           name="usuario"
                           placeholder="Ej. Admin_Kite"
                           required>
                </div>
            </div>

            <div class="mb-4">
                <label for="contrasena" class="form-label">Contraseña</label>

                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary text-secondary">
                        <i class="bi bi-key"></i>
                    </span>

                    <input type="password"
                           class="form-control border-start-0 ps-0"
                           id="contrasena"
                           name="contrasena"
                           placeholder="••••••••"
                           required>

                    <button type="button"
                            class="btn toggle-password"
                            onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-main w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
        </form>

        <a href="/login" class="back-link">
            <i class="bi bi-arrow-left me-1"></i> Volver a login de estudiantes
        </a>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("contrasena");
            const eyeIcon = document.getElementById("eyeIcon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");
            }
        }
    </script>

</body>

</html>
