<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub | Devolver Herramientas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
            color: #102542;
        }

        .navbar-custom {
            background: linear-gradient(90deg, #0b2a5b, #173b9b);
            padding: 14px 0;
        }

        .brand span {
            color: #18c29c;
        }

        .main-card {
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, .08);
        }

        .btn-main {
            background: linear-gradient(135deg, #10b981, #087d61);
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-weight: 700;
            color: white;
        }

        .btn-main:hover {
            opacity: 0.9;
            color: white;
        }

        .alert-custom {
            border-radius: 16px;
        }

        .form-check-input:checked {
            background-color: #10b981;
            border-color: #10b981;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container">
            <a href="/" class="navbar-brand fw-bold brand">Campus<span>Hub</span></a>
            <span class="text-white"><i class="bi bi-person-circle"></i> {{ session['usuario'] }}</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="main-card mb-4">
                    <h4 class="fw-bold mb-4">📦 Devolución de Herramientas</h4>

                    <p>Estás devolviendo las siguientes herramientas prestadas:</p>
                    <ul class="list-group mb-4" style="border-radius: 14px;">
                        {% for h in herramientas %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ h.nombre }}
                            <span class="badge bg-secondary rounded-pill">{{ h.codigo }}</span>
                        </li>
                        {% endfor %}
                    </ul>

                    <form action="/kite/herramientas/devolver/{{ prestamo_id }}" method="POST" id="formDevolucion">

                        <div class="alert alert-warning alert-custom">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="chkResponsabilidad" required>
                                <label class="form-check-label fw-bold" for="chkResponsabilidad">
                                    Estoy consciente de que, en caso de dar un mal uso al equipo, asumiré la
                                    responsabilidad por los daños que pudieran ocasionarse.
                                </label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">¿Alguna herramienta fue devuelta en mal estado o se dañó
                                durante su uso?</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="hubo_dano" id="danoNo" value="no"
                                        checked onchange="toggleDano()">
                                    <label class="form-check-label" for="danoNo">No, todas están bien</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="hubo_dano" id="danoSi" value="si"
                                        onchange="toggleDano()">
                                    <label class="form-check-label text-danger" for="danoSi">Sí, hubo daños</label>
                                </div>
                            </div>
                        </div>

                        <div id="seccionDano" class="alert alert-danger alert-custom" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label fw-bold">¿Cuál herramienta fue dañada?</label>
                                <select name="herramienta_danada" class="form-select" id="selectDanada"
                                    style="border-radius: 10px;">
                                    <option value="">Selecciona...</option>
                                    {% for h in herramientas %}
                                    <option value="{{ h.id }}">{{ h.nombre }} ({{ h.codigo }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div>
                                <label class="form-label fw-bold">Detalles del daño (Opcional)</label>
                                <textarea name="nota_dano" class="form-control" rows="2"
                                    style="border-radius: 10px;"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-main w-100" id="btnSubmit" disabled>
                            Confirmar Devolución
                        </button>
                    </form>
                </div>

                <div class="text-center">
                    <a href="/kite/herramientas" class="btn btn-outline-secondary">← Cancelar y volver</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chk = document.getElementById('chkResponsabilidad');
        const btn = document.getElementById('btnSubmit');
        const selectDanada = document.getElementById('selectDanada');
        const danoSi = document.getElementById('danoSi');

        function checkForm() {
            if (!chk.checked) {
                btn.disabled = true;
                return;
            }
            if (danoSi.checked && selectDanada.value === "") {
                btn.disabled = true;
                return;
            }
            btn.disabled = false;
        }

        chk.addEventListener('change', checkForm);
        selectDanada.addEventListener('change', checkForm);

        function toggleDano() {
            const seccion = document.getElementById('seccionDano');
            if (danoSi.checked) {
                seccion.style.display = 'block';
            } else {
                seccion.style.display = 'none';
                selectDanada.value = "";
            }
            checkForm();
        }
    </script>

</body>

</html>
