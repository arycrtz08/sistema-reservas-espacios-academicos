{% extends "base.html" %}

{% block title %}Acceso Denegado - KITE{% endblock %}

{% block content %}
<div class="container py-5 text-center mt-5">
    <div class="card shadow-sm border-danger mx-auto" style="max-width: 500px; border-radius: 16px;">
        <div class="card-body p-5">
            <i class="bi bi-x-octagon-fill text-danger" style="font-size: 4rem;"></i>
            <h3 class="fw-bold text-danger mt-3 mb-3">Acceso Denegado</h3>
            <p class="text-muted">Tu acceso a los servicios y herramientas del KITE ha sido bloqueado temporalmente por
                un administrador.</p>

            <div class="alert alert-danger text-start mt-4 mb-4" style="border-radius: 12px;">
                <h6 class="fw-bold"><i class="bi bi-chat-left-text-fill me-2"></i> Mensaje del Administrador:</h6>
                <p class="mb-0">{{ mensaje }}</p>
            </div>

            <a href="/" class="btn btn-outline-secondary w-100 mt-2" style="border-radius: 12px;">
                <i class="bi bi-arrow-left me-2"></i>Volver al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
