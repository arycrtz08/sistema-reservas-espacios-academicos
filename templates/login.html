<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Login</title>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col d-flex justify-content-center">
                <h1>Hola, me gustaría que completes tu información</h1>
            </div>
        </div>

        {% if error %}
        <div class="alert alert-danger text-center mt-3" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="mt-4">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required>
            </div>

            <div class="mb-3">
                <label for="carnet_us" class="form-label">Carnet, ej: Key_000###</label>
                <input type="text" class="form-control" id="carnet_us" name="carnet_us" required>
            </div>

            <div class="mb-3">
                <label for="cohorte" class="form-label">Cohorte a la que perteneces</label>
                <select id="cohorte" class="form-select" name="cohorte" required>
                    <option value="">Selecciona tu cohorte</option>
                    <option value="1">Cohorte 1</option>
                    <option value="2">Cohorte 2</option>
                    <option value="3">Cohorte 3</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>
</body>
</html>
