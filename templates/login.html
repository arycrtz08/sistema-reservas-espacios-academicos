<!Doctype html>
<html lang="en">  
<html>
    <head>
        <link rel = "stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <title>Login</title>
    </head>
    <body>
        <div class="container text-center">
            <div class="row">
                <div class="col d-flex justify-content-center">
                    <h1>Hola, me gustaria que completes con tu información</h1>
                </div>
            </div> 
        </div>
        <form method="post" action="/login">
            <div class="mb-3">
                <label for="exampleInputGabrielValencia" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="exampleInputGabrielValencia" name="usuario" required>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Carnet, ej: Key_000###</label>
                <input type="text" class="form-control" id="exampleInputKey_000###" name="carnet_us" required>
            </div>
            <div class="mb-3">
                <label for="cohorte" class="form-label">Cohorte a la que pertences</label>
                <select id="cohorte" class="form-select" name="cohorte" required>
                    <option value="">Selecciona tu cohorte</option>
                    <option value="1">Cohorte 1</option>
                    <option value="2">Cohorte 2</option>
                    <option value="3">Cohorte 3</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </body>
</html>
